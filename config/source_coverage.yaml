schema_version: book-job-scraping.source-coverage.v1
updated: 2026-09-14

# This registry describes how each business source is acquired. It is
# intentionally separate from jobs.yaml so product coverage, implementation
# readiness, and restoration priority remain visible in one place.
policy:
  acquisition_order:
    - api
    - cli
    - rss
    - scrape
  shared_engines:
    - httpx
    - rss
    - playwright
    - selenium
    - scrapy
    - firecrawl
  activation_rule: "Only activate a source when its adapter exists, its output contract is known, and a focused smoke test passes."
  safety_rule: "Respect robots.txt, source terms, rate limits, privacy, and applicable PDPA requirements."

business_lanes:
  jobs:
    priority: P0
    purpose: "Job and freelance discovery capture"
    contract: job.v1
  property:
    priority: P0
    purpose: "Property listing and price intelligence"
    contract: property-capture
  discovery:
    priority: P1
    purpose: "Technology, product, and developer trend intelligence"
    contract: discovery-capture
  news:
    priority: P1
    purpose: "Business and technology news feeds"
    contract: news-capture
  marketplace:
    priority: P1
    purpose: "Classified and marketplace listings"
    contract: marketplace-capture
  restaurants:
    priority: P1
    purpose: "Restaurant and local business discovery"
    contract: local-business-capture
  finance:
    priority: P1
    purpose: "Market, crypto, FX, and yield data"
    contract: finance-capture
  marketing:
    priority: P2
    purpose: "Search visibility and SEO intelligence"
    contract: marketing-capture
  ai:
    priority: P2
    purpose: "AI tool and product discovery"
    contract: ai-tool-capture
  travel:
    priority: P2
    purpose: "Flight and route price intelligence"
    contract: travel-capture
  operations:
    priority: P0
    purpose: "Collection health and operational visibility"
    contract: local-ops

